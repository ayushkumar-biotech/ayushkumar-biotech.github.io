<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayush Kumar | Biotechnology & AI Portfolio</title>
  <meta name="description" content="B.Tech Biotechnology student at AKTU, Lucknow. Bioinformatics Intern (CodeAlpha) | QA/QC Pharma Intern (Researium Labs) | Python, SAS, CRISPR, BLAST. Open to internships." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-elevated: #1a1a25;
      --text: #e8e8ed;
      --text-muted: #9898a6;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --border: rgba(255, 255, 255, 0.06);
      --gradient: linear-gradient(135deg, #00d4aa 0%, #00a8ff 100%);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: padding 0.3s ease;
    }
    nav.scrolled {
      padding: 0.9rem 2rem;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .logo span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: var(--accent);
    }
    .nav-cta {
      background: var(--accent);
      color: #0a0a0f !important;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .nav-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0, 212, 170, 0.35);
    }
    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 1.5rem;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 2rem 4rem;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      width: fit-content;
      border: 1px solid rgba(0, 212, 170, 0.2);
    }
    .hero-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }
    .hero h1 .highlight {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 2.5rem;
      font-weight: 400;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 212, 170, 0.35);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-elevated);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .hero-meta {
      display: flex;
      gap: 2rem;
      margin-top: 4rem;
      flex-wrap: wrap;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .meta-item span:first-child {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .meta-item span:last-child {
      font-weight: 600;
      font-size: 1rem;
    }
    section {
      padding: 6rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .section-desc {
      color: var(--text-muted);
      max-width: 540px;
      margin-bottom: 3rem;
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }
    .about-text p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      font-size: 1.05rem;
    }
    .about-text strong {
      color: var(--text);
      font-weight: 600;
    }
    .about-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }
    .tag {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .about-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
    }
    .about-card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 1.25rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-row span:first-child {
      color: var(--text-muted);
    }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .skill-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      transition: border-color 0.25s, transform 0.25s;
    }
    .skill-card:hover {
      border-color: rgba(0, 212, 170, 0.3);
      transform: translateY(-3px);
    }
    .skill-icon {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
    .skill-card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .skill-pill {
      background: var(--bg-elevated);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .projects-grid {
      display: grid;
      gap: 1.5rem;
    }
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.5rem;
      align-items: start;
      transition: border-color 0.25s, transform 0.25s;
    }
    .project-card:hover {
      border-color: rgba(0, 212, 170, 0.25);
      transform: translateY(-2px);
    }
    .project-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.7;
    }
    .project-content h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 0.6rem;
    }
    .project-content p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .project-tag {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .project-link {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .project-link:hover {
      color: var(--accent);
    }
    .edu-certs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .edu-card, .cert-list {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
    }
    .edu-card h3, .cert-list h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 1.25rem;
    }
    .edu-degree {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .edu-school {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
    .edu-period {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .edu-areas {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .cert-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .cert-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .cert-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .cert-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .cert-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .contact-section {
      text-align: center;
    }
    .contact-section .section-desc {
      margin-left: auto;
      margin-right: auto;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-top: 2.5rem;
    }
    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      transition: border-color 0.25s, transform 0.25s;
    }
    .contact-card:hover {
      border-color: rgba(0, 212, 170, 0.3);
      transform: translateY(-3px);
    }
    .contact-card .icon {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .contact-card h4 {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .contact-card a, .contact-card span {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-all;
    }
    .contact-card a:hover {
      color: var(--accent);
    }
    footer {
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    footer a {
      color: var(--accent);
    }
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--bg);
        flex-direction: column;
        padding: 1.5rem 2rem;
        border-bottom: 1px solid var(--border);
        gap: 1.25rem;
      }
      .nav-links.open {
        display: flex;
      }
      .menu-btn {
        display: block;
      }
      .about-grid,
      .edu-certs {
        grid-template-columns: 1fr;
      }
      .project-card {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
      .project-num {
        font-size: 1.1rem;
      }
      .hero {
        padding-top: 7rem;
      }
      .hero-meta {
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav id="nav">
    <a href="#" class="logo">Ayush<span>.</span></a>
    <ul class="nav-links" id="navLinks">
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#internships">Internships</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a
